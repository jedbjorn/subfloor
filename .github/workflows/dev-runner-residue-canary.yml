name: Dev runner residue canary

on:
  push:
    branches: [chore/dev-runner-routing]

permissions:
  contents: read

jobs:
  leave-residue:
    runs-on: [self-hosted, Linux, X64, subfloor]
    timeout-minutes: 10
    steps:
      - name: Deliberately abandon process, zombie, container, and files
        shell: bash
        run: |
          set -eu
          marker="${GITHUB_RUN_ID}-subfloor"
          mkdir -p "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          printf '%s\n' "$marker" > "$GITHUB_WORKSPACE/ci-residue-marker"
          printf '%s\n' "$marker" > "$RUNNER_TEMP/ci-residue-marker"
          docker run --detach \
            --name "ci-residue-$marker" \
            --volume "$GITHUB_WORKSPACE:/ci-workspace:ro" \
            alpine:3.22 sleep 600
          nohup bash -c "exec -a ci-orphan-$marker sleep 600" >/dev/null 2>&1 &
          nohup python3 -c 'import os,time; os.fork() or os._exit(0); time.sleep(600)' \
            "ci-zombie-$marker" >/dev/null 2>&1 &
          zombie_parent=$!
          sleep 2
          ps -o stat= --ppid "$zombie_parent" | grep -q '^Z'

  prove-clean-start:
    needs: leave-residue
    runs-on: [self-hosted, Linux, X64, subfloor]
    timeout-minutes: 10
    steps:
      - name: Prove previous job residue is gone
        shell: bash
        run: |
          set -eu
          marker="${GITHUB_RUN_ID}-subfloor"
          test ! -e "$GITHUB_WORKSPACE/ci-residue-marker"
          test ! -e "$RUNNER_TEMP/ci-residue-marker"
          test -z "$(docker ps --all --quiet --filter "name=^/ci-residue-$marker$")"
          MARKER="$marker" python3 - <<'PY'
          import os
          from pathlib import Path

          marker = os.environ["MARKER"].encode()
          offenders = []
          for process in Path("/proc").iterdir():
              if not process.name.isdecimal() or int(process.name) == os.getpid():
                  continue
              try:
                  command = (process / "cmdline").read_bytes()
              except OSError:
                  continue
              if marker in command:
                  offenders.append((process.name, command.replace(b"\0", b" ").decode(errors="replace")))
          if offenders:
              raise SystemExit(f"residual job processes: {offenders}")
          PY
          test -z "$(ps -eo stat=,pid=,ppid=,comm= | awk '$1 ~ /^Z/ {print}')"
