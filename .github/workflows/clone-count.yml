name: Archive clone counts

on:
  schedule:
    - cron: '27 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: subfloor-clone-counts

jobs:
  archive:
    if: github.repository == 'jedbjorn/subfloor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: clone-traffic
          path: archive
      - name: Refresh clone traffic
        id: refresh
        env:
          # Fine-grained token with Administration (read) on the listed public repos.
          GH_TOKEN: ${{ secrets.CLONE_TRAFFIC_READ_TOKEN }}
        run: python3 .github/scripts/refresh-clone-traffic.py archive
      - name: Publish refreshed counts even if one repository was unavailable
        if: ${{ !cancelled() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure') }}
        working-directory: archive
        run: |
          git add -- counts.json
          if test -f unique-cloners.json; then git add -- unique-cloners.json; fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh clone traffic badges'
            git push origin HEAD:refs/heads/clone-traffic
          fi
