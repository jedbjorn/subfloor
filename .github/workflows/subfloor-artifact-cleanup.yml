# Fork-owned: generated by sc actions-artifacts setup-ci; review and commit.
name: Subfloor artifact cleanup
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Delete eligible artifacts (unchecked performs a dry run)
        type: boolean
        default: false
permissions:
  actions: write
concurrency:
  group: subfloor-artifact-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ARTIFACT_RETENTION_DAYS: '7'
      APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
    steps:
      - name: Sweep old artifacts from completed runs
        shell: bash
        run: |
          args=(--repo "$GH_REPO" --older-than-days "$ARTIFACT_RETENTION_DAYS")
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python3 - "${args[@]}" <<'SUBFLOOR_ARTIFACT_PY'
          """Repository-scoped Actions artifact cleanup; also runs standalone in CI."""
          from __future__ import annotations
          
          import argparse
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timedelta, timezone
          
          
          class CleanupError(RuntimeError):
              pass
          
          
          def positive_days(value: str) -> int:
              try:
                  days = int(value)
              except ValueError as exc:
                  raise argparse.ArgumentTypeError("retention must be a positive number of days") from exc
              if days < 1:
                  raise argparse.ArgumentTypeError("retention must be at least one day")
              return days
          
          
          def gh(arguments: list[str]) -> str:
              env = os.environ.copy()
              if env.get("SC_GH_TOKEN"):
                  env["GH_TOKEN"] = env["SC_GH_TOKEN"]
              try:
                  result = subprocess.run(
                      ["gh", *arguments], capture_output=True, text=True, timeout=60, env=env, check=False,
                  )
              except (OSError, subprocess.TimeoutExpired) as exc:
                  raise CleanupError("GitHub CLI unavailable or timed out") from exc
              if result.returncode:
                  # Do not echo credential-bearing subprocess output.
                  raise CleanupError(
                      f"GitHub CLI failed (exit {result.returncode}); check authentication, "
                      "repository access and Actions permissions"
                  )
              return result.stdout
          
          
          def api(endpoint: str, method: str = "GET"):
              output = gh([
                  "api", "--hostname", "github.com", "--method", method,
                  "-H", "Accept: application/vnd.github+json",
                  "-H", "X-GitHub-Api-Version: 2022-11-28", endpoint,
              ])
              try:
                  return json.loads(output) if output.strip() else None
              except json.JSONDecodeError as exc:
                  raise CleanupError(f"invalid GitHub JSON response for {endpoint}") from exc
          
          
          def timestamp(value: str) -> datetime:
              result = datetime.fromisoformat(value.replace("Z", "+00:00"))
              if result.tzinfo is None:
                  raise ValueError("timestamp needs a timezone")
              return result
          
          
          def inventory(repo: str) -> list[dict]:
              """Read every page before deleting: mutations must not shift pagination."""
              artifacts = {}
              page = 1
              while True:
                  payload = api(f"repos/{repo}/actions/artifacts?per_page=100&page={page}")
                  batch = payload["artifacts"]
                  for artifact in batch:
                      artifacts[artifact["id"]] = artifact
                  if len(batch) < 100:
                      return list(artifacts.values())
                  page += 1
          
          
          def cleanup(repo: str, days: int, apply: bool, now: datetime | None = None) -> dict:
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+", repo) or repo.rsplit("/", 1)[-1] in {".", ".."}:
                  raise CleanupError("repository must be OWNER/REPO")
              if days < 1:
                  raise CleanupError("retention must be at least one day")
              cutoff = (now or datetime.now(timezone.utc)) - timedelta(days=days)
              artifacts = inventory(repo)
              runs = {}
              candidates = []
              skipped = 0
              for artifact in artifacts:
                  if timestamp(artifact["created_at"]) >= cutoff:
                      continue
                  run_id = artifact.get("workflow_run", {}).get("id")
                  if not isinstance(run_id, int) or run_id < 1:
                      skipped += 1
                      continue
                  if run_id not in runs:
                      runs[run_id] = api(f"repos/{repo}/actions/runs/{run_id}")
                  run = runs[run_id]
                  # A recent rerun can still consume old artifacts. Keep it through the
                  # same grace period, and never delete from active/queued runs.
                  if run["status"] != "completed" or timestamp(run["updated_at"]) >= cutoff:
                      skipped += 1
                      continue
                  candidates.append(artifact)
          
              removed_bytes = 0
              removed_count = 0
              for artifact in candidates:
                  if apply:
                      # Recheck immediately before each DELETE, including rerun age.
                      run = api(f"repos/{repo}/actions/runs/{artifact['workflow_run']['id']}")
                      if run["status"] != "completed" or timestamp(run["updated_at"]) >= cutoff:
                          skipped += 1
                          continue
                      api(f"repos/{repo}/actions/artifacts/{artifact['id']}", "DELETE")
                  removed_bytes += artifact["size_in_bytes"]
                  removed_count += 1
                  print(json.dumps({
                      "action": "deleted" if apply else "would-delete",
                      "repository": repo, "id": artifact["id"], "name": artifact["name"],
                      "bytes": artifact["size_in_bytes"],
                  }, sort_keys=True), flush=True)
              summary = {
                  "repository": repo, "apply": apply, "older_than_days": days,
                  "inventory_count": len(artifacts), "candidate_count": len(candidates),
                  "deleted_count" if apply else "would_delete_count": removed_count,
                  "skipped_count": skipped, "bytes": removed_bytes,
              }
              print(json.dumps(summary, sort_keys=True), flush=True)
              return summary
          
          
          def main(argv: list[str] | None = None) -> int:
              parser = argparse.ArgumentParser(prog="sc actions-artifacts cleanup", description=__doc__)
              parser.add_argument("--repo", help="GitHub OWNER/REPO; defaults to the caller's origin")
              parser.add_argument("--older-than-days", type=positive_days, default=7)
              parser.add_argument("--apply", action="store_true", help="delete; default is read-only dry run")
              args = parser.parse_args(argv)
              repo = args.repo or gh(["repo", "view", "--json", "nameWithOwner", "--jq", ".nameWithOwner"]).strip()
              cleanup(repo, args.older_than_days, args.apply)
              return 0
          
          try:
              raise SystemExit(main())
          except (CleanupError, KeyError, TypeError, ValueError) as exc:
              raise SystemExit(f"actions-artifacts: {exc}") from exc
          SUBFLOOR_ARTIFACT_PY
