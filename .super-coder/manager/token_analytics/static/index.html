<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Token Analytics · Subfloor Manager</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/manager.css">
  <link rel="stylesheet" href="/analytics/style.css">
</head>
<body>
  <header class="app-header">
    <strong class="brand">Subfloor Manager</strong>
    <nav class="app-nav" aria-label="Manager pages">
      <a href="/">Installations</a>
      <a href="/analytics/" aria-current="page">Token Analytics</a>
      <button id="paired-browsers" class="nav-button" type="button" hidden>Paired browsers</button>
    </nav>
    <div class="header-tools">
      <span id="status" class="status"></span>
      <div class="theme-switch" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="system" aria-label="System theme" title="System — match this device" aria-pressed="false"><svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M9 20h6m-3-4v4"></path></svg></button>
        <button type="button" data-theme-choice="light" aria-label="Light theme" title="Light theme" aria-pressed="false"><svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42m0-14.14-1.42 1.42M6.35 17.65l-1.42 1.42"></path></svg></button>
        <button type="button" data-theme-choice="dark" aria-label="Dark theme" title="Dark theme" aria-pressed="false"><svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path></svg></button>
      </div>
      <button id="refresh" type="button" title="Collect usage from local installations">Refresh</button>
    </div>
  </header>
  <main class="manager-main analytics-main">
    <section class="page-title analytics-title"><div><p class="eyebrow">Cross-project usage</p><h1>Token Analytics</h1><p class="page-subtitle">Token usage and activity across local installations.</p></div></section>
    <div id="collection-errors" role="status"></div>
    <section id="view" class="view" aria-label="Token analytics dashboard"></section>
  </main>
  <script src="/auth.js" defer></script>
  <script src="/analytics/app.js"></script>
</body>
</html>
